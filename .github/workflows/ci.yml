name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hustcer/setup-moonbit@develop
        with:
          version: nightly
      - run: moon update
      - run: moon check --target all
      - run: moon test --target all
      - run: moon test --target all --release
      - run: moon info --target all && moon fmt && git diff --exit-code
